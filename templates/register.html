<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student360 | Create account</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<div class="auth"><div class="brand" style="padding:0 0 18px">Student<span>360</span></div><div class="card">
{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}
<h2>Create account</h2><form method="post"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="student_id" placeholder="Student ID (e.g. S100001)" required><input name="password" type="password" placeholder="Password (min 6 chars)" required><input name="confirm" type="password" placeholder="Confirm password" required><button>Register</button></form><p class="notice">Already registered? <a href="/login">Login</a></p></div></div></body></html>
